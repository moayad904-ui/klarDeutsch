<script>
    // 1. إخفاء شاشة البداية بعد ثانية ونصف حتماً وبشكل آمن تماماً
    function dismissSplash() {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.style.transition = 'opacity 0.5s ease-out';
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(() => {
          splash.remove(); // إزالة الشاشة نهائياً من الصفحة
        }, 500);
      }
    }

    // تشغيل الإخفاء التلقائي بعد 1.5 ثانية
    window.addEventListener('load', () => {
      setTimeout(dismissSplash, 1500);
    });

    // كإجراء أمان إضافي: إذا مرت ثانيتان ولم تختفِ، تختفي فوراً
    setTimeout(dismissSplash, 2000);

    // وإذا لمس المستخدم الشاشة في أي مكان تختفي فوراً
    document.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.addEventListener('click', dismissSplash);
        splash.addEventListener('touchstart', dismissSplash);
      }
    });

    // 2. تفعيل أيقونات Lucide بشكل آمن
    try {
      if (window.lucide) {
        lucide.createIcons();
      }
    } catch(e) {
      console.log('Icons init note:', e);
    }
  </script>
